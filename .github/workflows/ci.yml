name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Every run of this workflow shares ONE Neon dev branch, and the DB-backed
# suites seed fixtures under fixed ids (`test-evt-*`, `test-community-*@…`).
# Two runs overlapping therefore delete each other's rows mid-test, and the
# failures look like real regressions: `23503 … is still referenced from
# table "participations"`, `CapacityReachedError`, a promoteWaitlist that
# reports `promoted: false` because someone else's beforeEach removed the
# waitlist row first.
#
# `vitest.config.ts` sets maxWorkers:1, which serialises *within* a run and
# can do nothing about this. With ~9 open PRs the collisions were constant
# and had already cost three separate programmes a debugging cycle each.
#
# So: one run at a time, repo-wide. `cancel-in-progress: false` because
# queueing is the point — cancelling would just move the flake to
# "my PR never got a verdict".
concurrency:
  group: ci-shared-neon-branch
  cancel-in-progress: false

jobs:
  check:
    name: Build + lint + test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # npm 10 (Node 20) rejects lockfiles generated by npm 11, which is
          # what local dev runs — keep CI on the same npm major.
          node-version: "24"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        # Build runs the TypeScript type-checker for Next routes.
        # DATABASE_URL must be present at build time only to satisfy the
        # module-load-time check in src/db/index.ts; no queries run.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_DEV }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED_DEV }}
          REDIS_URL: "redis://localhost:6379"
          MP_ACCESS_TOKEN: "build-time-placeholder"
          RESEND_API_KEY: "build-time-placeholder"
        run: npm run build

      - name: Migrate dev DB
        # Drizzle's INSERTs reference every column in the schema (with
        # `default` for unspecified ones), so integration tests fail if
        # the dev DB lags the schema. Apply pending migrations before
        # running tests. drizzle-kit reads DATABASE_URL_UNPOOLED via
        # drizzle.config.ts.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_DEV }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED_DEV }}
        run: npm run db:migrate

      - name: Test
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_DEV }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED_DEV }}
        run: npm test
        # Tests are only run if the DB secrets are configured. On first-time
        # setups this step will fail with a clear error — see docs/specs/01
        # for the one-time GitHub Actions secret setup.
